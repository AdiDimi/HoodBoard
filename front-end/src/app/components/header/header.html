<header class="hero">
  <div class="container">
    <div class="header-content">
      <div class="title-section">
        <h1 class="title">
          <span class="sub">Product Catalog</span>
          <span class="main">Manage Your Products</span>
        </h1>
        <p class="tagline">Browse, search, edit, and export your inventory.</p>
      </div>
      <div class="header-actions">
        <button class="create-post-btn" (click)="createPost()">
          <span class="plus-icon">+</span>
          Add Product
        </button>
        <button class="export-btn" (click)="exportXlsx()">Export XLSX</button>
      </div>
    </div>
  </div>
</header>
